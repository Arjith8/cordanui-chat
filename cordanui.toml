runtime = "lua"

[plugin]
name = "cordanui-chat"
version = "0.1.0"
description = "Chat panel for cordanui"

[capabilities]
provider = false
command = true
agent = false
theme = false

[[field]]
key = "default_model"
label = "Default model"
type = "select"
options = ["grok-code", "gemini-3-pro"]
default = "grok-code"

[[field]]
key = "system_prompt"
label = "System prompt"
type = "text"
default = "You are a helpful assistant for goal tracking."

[[help]]
title = "Chat"
text = """
Run `cordanui-chat.open` from <leader>; (command palette).
Type message, Enter sends, Esc closes. History persists via settings and syncs via Turso.
If cordanui-agents is running, /clear clears history.
Models come from cordanui-agents GET /models — no provider config needed in chat.
"""

[[help]]
title = "Keys"
text = "Enter send · Esc close · Backspace delete · /clear wipe · /model to pick model"
