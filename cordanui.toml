runtime = "lua"

[plugin]
name = "cordanui-chat"
version = "0.1.0"
description = "Chat panel for cordanui"

[capabilities]
provider = false
command = true
agent = false
theme = false

[[help]]
title = "Chat"
text = """
Run `cordanui-chat.open` from <leader>; (command palette) — opens Chat panel (dedicated overlay, separate from goals/buffers).
Type message, Enter sends, q (when draft empty) closes. Esc does nothing. History persists via settings and syncs via Turso.
Mentions: @1-6 or @<sno>-<sno> (sno=serial, visible order; uuid fallback) in any message auto-assigns that range to agent with current model.
Commands: cordanui-chat.clear, .model, .assign (range picker). Models from cordanui-agents GET /models.
"""

[[help]]
title = "Keys"
text = "Enter send · q close (when draft empty) · Esc does nothing · Backspace delete · /clear wipe · /model pick · @1-6 assign · / ↑↓ Tab dropdown · @ ↑↓ Tab dropdown (sno, not popup)"

[[help]]
title = "Assign"
text = """
cordanui-chat.assign from <leader>; prompts for @1-6 or @<sno>-<sno> (sno=serial). Also typing @1-6 / @<sno>-<sno> (uuid fallback) inside a chat message while sending auto-assigns via cord.goals.assign_range with your selected model (shown in header). Direct goals-page assign: <leader>A or bare @ in TUI, long-press → Assign in mobile.
"""
